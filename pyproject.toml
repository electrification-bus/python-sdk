[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ebus-sdk"
# Single source of truth: src/ebus_sdk/__init__.py's __version__ (read
# dynamically below, and by setup.py's legacy/kirkstone path). Bump it in ONE
# place; a publish.yml guard fails the release if the git tag disagrees.
dynamic = ["version"]
description = "Python SDK for Homie MQTT Convention (eBus)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Clark Communications Corporation"}
]
keywords = ["mqtt", "homie", "iot", "ebus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    # MQTT transport lives in ebus-mqtt-client, which pins paho-mqtt; the SDK
    # does not import paho directly, so paho is a transitive dependency (not
    # declared here). Floor 0.3.0: it ships the PEP 561 py.typed marker, so a
    # downstream type checker resolves the re-exported MqttClient to the concrete
    # class instead of Any, completing the transport Protocol typing (MqttTransport
    # / MqttControllerTransport / MqttDeviceTransport) the SDK added in 0.16.0.
    # Earlier floors, still relied on: 0.2.0 added the on_disconnect_callback the
    # disconnect hook adopts (SDK-al5); 0.1.8 added the connect_async construction
    # the resilient-connect behavior relies on (older clients raised
    # ConnectionRefusedError on a down broker).
    "ebus-mqtt-client>=0.3.0",
]

[project.optional-dependencies]
mdns = ["zeroconf>=0.131.0"]
# Optional: JSONSchema validation of `json`-datatype property `$format`. Absent
# it, the SDK still runs and $format validation is gracefully skipped (with a
# one-time warning). Kept optional so a constrained build (e.g. Yocto) can omit
# it without a hard dependency. jsonschema>=4.0 is satisfied by kirkstone's
# meta-python (4.4.0, pyrsistent-based, no Rust toolchain).
validation = ["jsonschema>=4.0"]
dev = ["pytest", "jsonschema>=4.0"]

[project.urls]
Homepage = "https://ebus.energy"
Repository = "https://github.com/electrification-bus/python-sdk"
Issues = "https://github.com/electrification-bus/python-sdk/issues"

[tool.setuptools.dynamic]
version = {attr = "ebus_sdk.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# Ship the PEP 561 marker so consumers' type checkers use the SDK's inline types
# (SDK-61t.4). The legacy setup.py shim carries the same package_data for the
# Yocto/kirkstone build path, where a bare marker is otherwise dropped.
[tool.setuptools.package-data]
ebus_sdk = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E402: module-level imports not at top — triggered by __future__ + docstring pattern
# E721: type comparison with == — intentional in datatype_from_type()
ignore = ["E402", "E721"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
